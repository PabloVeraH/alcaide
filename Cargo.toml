[workspace]
resolver = "2"
members = [
    "alcaide-core",
    "alcaide-cli",
    # "alcaide-py" is added in milestone M8 — pyo3 0.22 (latest stable as of
    # writing) doesn't support Python 3.14 yet, installed in this environment.
    # Not worth resolving that incompatibility for a crate with no real logic yet.
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/PabloVeraH/alcaide"
description = "Filtro de inyección de prompts en Rust: motor de reglas deterministas para LLMs"

[workspace.dependencies]
alcaide-core = { path = "alcaide-core", version = "0.1.0" }
aho-corasick = "1"
regex = "1"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1"
tracing = "0.1"
