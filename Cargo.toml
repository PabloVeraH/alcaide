[workspace]
resolver = "2"
members = [
    "alcaide-core",
    "alcaide-cli",
    "alcaide-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/PabloVeraH/alcaide"
keywords = ["prompt-injection", "llm", "security", "jailbreak", "firewall"]

[workspace.dependencies]
alcaide-core = { path = "alcaide-core", version = "0.1.0" }
aho-corasick = "1"
regex = "1"
regex-syntax = "0.8"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
thiserror = "2"
tracing = "0.1"
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
pyo3 = "0.29"
clap = { version = "4", features = ["derive"] }
