name: Fuzz

# Coverage-guided fuzzing of alcaide-core (see fuzz/README.md).
# Short runs on every change to the engine, long runs weekly. The corpus
# each run grows is cached, so every run starts where the last one ended.

on:
  push:
    branches: [main]
    paths: ["alcaide-core/**", "fuzz/**", ".github/workflows/fuzz.yml"]
  pull_request:
    paths: ["alcaide-core/**", "fuzz/**", ".github/workflows/fuzz.yml"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "1800"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [evaluate, normalize, rules_yaml, rule_patterns]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || (github.event_name == 'schedule' && '1800') || '120' }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          seeds=fuzz/seeds/${{ matrix.target }}
          [ -d "$seeds" ] || seeds=
          dict=-dict=fuzz/dict/text.dict
          [ "${{ matrix.target }}" = rules_yaml ] && dict=
          cargo fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} $seeds -- \
            $dict -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=2048
      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
