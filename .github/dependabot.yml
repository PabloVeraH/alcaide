version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The fuzz crate is outside the workspace and has its own lockfile. Only
  # its own dependencies: the workspace's are bumped by the entry above, and
  # bumping them from here opened duplicate PRs without the code fixes.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    allow:
      - dependency-name: libfuzzer-sys
      - dependency-name: arbitrary
    groups:
      fuzz:
        patterns: ["*"]
